<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>I Can't Believe CRM social preview</title>
<style>
  *{box-sizing:border-box}body{margin:0;width:1280px;height:640px;background:#0a0a0b;color:#f5f3ed;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  .card{width:100%;height:100%;display:grid;grid-template-columns:46% 54%;position:relative;background:radial-gradient(circle at 24% 18%,#252529 0,#111113 40%,#0a0a0b 72%)}
  .card:after{content:"";position:absolute;inset:auto 0 0;height:8px;background:linear-gradient(90deg,#d8ff3e 0 23%,#3f5bff 23% 100%)}
  .mark{display:grid;place-items:center}.symbol{width:300px;height:300px;border-radius:58px;background:#0a0a0b;border:1px solid #313135;display:grid;place-items:center}.symbol img{width:250px;height:250px}
  .copy{display:flex;flex-direction:column;justify-content:center;padding:70px 76px 70px 20px}.eyebrow{font-size:18px;letter-spacing:8px;color:#d8ff3e;margin-bottom:30px}.copy h1{font-size:78px;line-height:.9;letter-spacing:-5px;margin:0 0 34px}.copy p{font-size:25px;line-height:1.4;color:#c9c5bc;margin:0;max-width:560px}.cobalt{color:#3f5bff}.rule{width:92px;height:3px;background:#d8ff3e;margin-top:42px}
</style>
</head>
<body><main class="card"><section class="mark"><div class="symbol"><img src="ai-icon.svg" alt="!AI"></div></section><section class="copy"><div class="eyebrow">BUILD · AUTOMATE · INTELLIGENCE · OPERATE</div><h1>I Can't<br>Believe <span class="cobalt">CRM</span></h1><p>Atendimento, vendas, WhatsApp e agentes de IA em uma plataforma feita para negócios.</p><div class="rule"></div></section></main></body>
</html>
